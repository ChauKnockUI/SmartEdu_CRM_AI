version: '3.8'

services:
  smartedu-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartedu_crm_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount thư mục ai_models: Khi bạn train lại file .pkl thì Docker tự nhận ngay mà không cần mất công rebuild lại image
      - ./ai_models:/app/ai_models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
