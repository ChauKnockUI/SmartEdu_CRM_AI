  <text x="1120" y="338" class="t">Assignment_Missing_Rate</text>
  <text x="1120" y="368" class="t">Assignment_Late_Count</text>
  <text x="1120" y="398" class="t">Submitted / late / missing / excused</text>

  <rect x="90" y="535" width="420" height="210" class="card"/>
  <rect x="90" y="535" width="420" height="48" fill="#7c3aed" rx="18"/>
