  <text x="1120" y="663" class="t">Has_Overdue_Invoice, Days_Overdue</text>
  <text x="1120" y="693" class="t">Days_Since_Last_Attended</text>
  <text x="1120" y="723" class="t">Class_Progress_Ratio</text>

  <path d="M510 315 C610 315 650 400 675 430" stroke="#94a3b8" stroke-width="4" fill="none"/>
  <path d="M1090 315 C990 315 950 400 925 430" stroke="#94a3b8" stroke-width="4" fill="none"/>
  <path d="M510 640 C610 640 650 520 675 480" stroke="#94a3b8" stroke-width="4" fill="none"/>
