<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .title{font:700 44px Arial,sans-serif;fill:#111827}
    .sub{font:400 22px Arial,sans-serif;fill:#4b5563}
    .card{fill:white;stroke:#d1d5db;stroke-width:3;rx:18}
    .h{font:700 25px Arial,sans-serif;fill:#111827}
    .t{font:400 19px Arial,sans-serif;fill:#374151}
    .tag{font:700 18px Arial,sans-serif;fill:white}
    .center{fill:#111827}
  </style>
  <rect width="1600" height="900" fill="#f9fafb"/>
  <text x="80" y="86" class="title">Dropout Model v2 - Feature Engineering</text>
  <text x="82" y="125" class="sub">13 feature duoc tong hop tu du lieu that cua CRM/LMS theo tung hoc vien trong tung lop</text>

  <circle cx="800" cy="455" r="128" fill="#111827"/>
  <text x="724" y="430" class="tag">Dropout</text>
  <text x="694" y="465" class="tag">Risk Model v2</text>
  <text x="713" y="500" class="tag">Random Forest</text>

  <rect x="90" y="210" width="420" height="210" class="card"/>
  <rect x="90" y="210" width="420" height="48" fill="#2563eb" rx="18"/>
  <text x="120" y="242" class="tag">Attendance Signals</text>
  <text x="120" y="300" class="h">Di hoc va vang hoc</text>
  <text x="120" y="338" class="t">Attendance_Rate</text>
  <text x="120" y="368" class="t">Unexcused_Absence_Count / Rate</text>
  <text x="120" y="398" class="t">Late_Count, Consecutive_Unexcused</text>

  <rect x="1090" y="210" width="420" height="210" class="card"/>
