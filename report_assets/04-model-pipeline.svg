<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <style>
      .title{font:700 44px Arial,sans-serif;fill:#111827}
      .sub{font:400 22px Arial,sans-serif;fill:#4b5563}
      .box{fill:white;stroke:#c7d2fe;stroke-width:3;rx:18}
      .head{font:700 24px Arial,sans-serif;fill:#111827}
      .text{font:400 18px Arial,sans-serif;fill:#374151}
      .line{stroke:#4f46e5;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .metric{font:700 24px Arial,sans-serif;fill:#065f46}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#eef2ff"/>
  <text x="80" y="86" class="title">AI Training & Deployment Pipeline</text>
  <text x="82" y="125" class="sub">Tu synthetic business dataset den model file va endpoint phuc vu backend</text>

  <g transform="translate(85 245)">
    <rect width="245" height="170" class="box"/>
    <text x="32" y="50" class="head">1. Generate Dataset</text>
    <text x="32" y="92" class="text">Persona-based</text>
    <text x="32" y="122" class="text">6000 records</text>
    <text x="32" y="152" class="text">13 features</text>
  </g>

  <g transform="translate(405 245)">
    <rect width="245" height="170" class="box"/>
    <text x="32" y="50" class="head">2. Train Model</text>
    <text x="32" y="92" class="text">Imputer</text>
    <text x="32" y="122" class="text">StandardScaler</text>
    <text x="32" y="152" class="text">RandomForest</text>
  </g>

  <g transform="translate(725 245)">
    <rect width="245" height="170" class="box"/>
    <text x="32" y="50" class="head">3. Evaluate</text>
    <text x="32" y="92" class="text">ROC-AUC</text>
    <text x="32" y="122" class="text">Recall</text>
    <text x="32" y="152" class="text">FN rate</text>
  </g>

  <g transform="translate(1045 245)">
    <rect width="245" height="170" class="box"/>
    <text x="32" y="50" class="head">4. Export</text>
    <text x="32" y="92" class="text">joblib pipeline</text>
    <text x="32" y="122" class="text">dropout_model_v2</text>
    <text x="32" y="152" class="text">.pkl</text>
  </g>

  <g transform="translate(635 555)">
    <rect width="330" height="170" class="box"/>
    <text x="45" y="52" class="head">5. Serve API</text>
    <text x="45" y="94" class="text">FastAPI /predict-dropout</text>
    <text x="45" y="124" class="text">risk_level + probability</text>
    <text x="45" y="154" class="text">top_reasons + action</text>
  </g>

  <path d="M330 330 H405" class="line"/>
  <path d="M650 330 H725" class="line"/>
  <path d="M970 330 H1045" class="line"/>
  <path d="M1170 415 C1170 535 965 620 965 620" class="line"/>

  <rect x="95" y="555" width="430" height="170" fill="#ecfdf5" stroke="#34d399" stroke-width="3" rx="18"/>
  <text x="135" y="608" class="head">QA Result</text>
  <text x="135" y="650" class="metric">ROC-AUC: 0.8981</text>
  <text x="135" y="685" class="metric">Recall @ 40%: 0.8860</text>
  <text x="135" y="720" class="metric">FN rate: 11.4%</text>

  <rect x="1075" y="555" width="390" height="170" fill="#fff7ed" stroke="#fb923c" stroke-width="3" rx="18"/>
  <text x="1115" y="608" class="head">Acceptance</text>
  <text x="1115" y="650" class="text">ROC-AUC >= 0.85</text>
  <text x="1115" y="680" class="text">Recall >= 0.80</text>
  <text x="1115" y="710" class="text">FN rate <= 20%</text>
</svg>
